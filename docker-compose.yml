version: "3.8"

services:
  db:
    image: postgres:15
    container_name: aisthetic-db
    environment:
      - POSTGRES_USER=airbender
      - POSTGRES_DB=aisthetic_control
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    networks:
      - aisthetic-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aisthetic-redis
    ports:
      - "6379:6379"
    networks:
      - aisthetic-net

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-node1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - aisthetic-net
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - aisthetic-net

  app:
    build: .
    container_name: aisthetic-app
    ports:
      - "8000:8000"
    environment:
      - CONTROL_DB_DSN=postgresql+psycopg2://airbender@db:5432/aisthetic_control
      - OPENSEARCH_HOST=http://opensearch:9200
      - REDIS_URL=redis://redis:6379/0
      - TEXT_EMBEDDING_API_KEY=${TEXT_EMBEDDING_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    depends_on:
      - db
      - redis
      - opensearch
    networks:
      - aisthetic-net

networks:
  aisthetic-net:
    driver: bridge

volumes:
  postgres_data:
  opensearch_data:
